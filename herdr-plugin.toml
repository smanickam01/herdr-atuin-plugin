id = "atuin.history-popup"
name = "Atuin history popup"
version = "0.4.1"
min_herdr_version = "0.7.0"
description = "Atuin history search helpers"
platforms = [ "macos" ]

# Herdr ignores [[keys.command]] declared in a plugin manifest, so the binding
# is written into the user's config.toml at install time instead. Runs on
# `plugin install` only -- `plugin link` skips build steps, so contributors add
# the binding by hand (or run this script directly).
[[build]]
command = ["zsh", "setup-keybinding.sh"]

# The popup itself. Declaring placement here means callers can open it with
# `herdr plugin pane open --plugin atuin.history-popup --entrypoint history`
# and inherit the popup placement and sizing without repeating them.
[[panes]]
id = "history"
title = "Atuin history"
placement = "popup"
width = "80%"
height = "80%"
command = ["zsh", "herdr-atuin.sh"]

# Bindable entrypoint: opens the popup pane above. Herdr keybindings can
# invoke a plugin action by qualified id, but cannot target a pane directly,
# so this action is the bridge between `prefix+a` and the popup.
[[actions]]
id = "shell-history"
title = "Shell history"
contexts = ["workspace"]
command = [
  "zsh",
  "-c",
  '"${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin atuin.history-popup --entrypoint history --env HERDR_ORIGIN_PANE_ID="${HERDR_PANE_ID:-}" --focus',
]
